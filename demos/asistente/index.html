<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente, Distribuidora Ríos</title>
<meta name="description" content="Demo de un asistente que responde con los documentos de una empresa y muestra de dónde sacó cada respuesta.">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151B" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F5;
    --surface: #FFFFFF;
    --soft: #F6F8FA;
    --ink: #161B22;
    --muted: #5D6673;
    --line: #D6DCE4;
    --accent: #3348C8;
    --accent-ink: #FFFFFF;
    --accent-soft: #E3E7FB;
    --mark: #FFE58A;
    --mark-ink: #161B22;
    --warn: #9A4A12;
    --warn-soft: #FBEADB;
    color-scheme: light;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151B;
      --surface: #191F27;
      --soft: #1F2630;
      --ink: #E8ECF2;
      --muted: #9AA4B2;
      --line: #2E3744;
      --accent: #8C9BFF;
      --accent-ink: #0F1430;
      --accent-soft: #252C52;
      --mark: #6B5A12;
      --mark-ink: #FFF6CC;
      --warn: #F3B07E;
      --warn-soft: #3A2616;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  mark { background: var(--mark); color: var(--mark-ink); border-radius: 3px; padding: 0 2px; }

  .app { height: 100vh; display: grid; grid-template-rows: auto 1fr; }
  header.bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 800 1rem var(--display); }
  .bar h1 { font: 700 1.05rem/1.1 var(--display); margin: 0; }
  .bar p { margin: 0; color: var(--muted); font-size: .82rem; }
  .bar .sp { flex: 1; }
  .pill { font-size: .78rem; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .menu-btn { display: none; border: 1px solid var(--line); background: var(--soft); border-radius: 10px; padding: 6px 10px; font-weight: 600; }

  .cols { display: grid; grid-template-columns: 260px minmax(0, 1fr) 360px; min-height: 0; }
  aside, section.chat, .fuente { min-height: 0; }
  aside.docs { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 12px; }
  .tabs button { border: 0; background: transparent; padding: 7px 0; border-radius: 9px; font-weight: 600; font-size: .85rem; color: var(--muted); }
  .tabs button[aria-pressed="true"] { background: var(--soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .side-body { overflow: auto; padding: 0 12px 12px; flex: 1; }
  .side-h { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 8px 4px 6px; }
  .doc { display: flex; align-items: flex-start; gap: 10px; width: 100%; border: 0; background: transparent; text-align: left; padding: 9px 8px; border-radius: 10px; }
  .doc:hover { background: var(--soft); }
  .doc svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--muted); }
  .doc b { display: block; font-weight: 600; font-size: .9rem; }
  .doc small { color: var(--muted); font-size: .78rem; }
  .doc.nuevo svg { color: var(--accent); }
  .add { margin-top: 10px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px; }
  .add p { margin: 0 0 8px; font-size: .82rem; color: var(--muted); }
  .add textarea { width: 100%; min-height: 90px; resize: vertical; border: 1px solid var(--line); border-radius: 9px; background: var(--soft); padding: 8px; font-size: .85rem; }
  .add input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: 9px; background: var(--soft); padding: 7px 8px; font-size: .85rem; margin-bottom: 6px; }
  .add .row { display: flex; gap: 6px; margin-top: 6px; }
  .small-btn { border: 1px solid var(--line); background: var(--soft); border-radius: 9px; padding: 6px 10px; font-size: .82rem; font-weight: 600; }
  .small-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .file-label { position: relative; overflow: hidden; display: inline-block; }
  .file-label input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .stat b { display: block; font: 700 1.4rem var(--display); }
  .stat span { font-size: .75rem; color: var(--muted); }
  .q-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .q-list li { background: var(--warn-soft); color: var(--ink); border-radius: 10px; padding: 8px 10px; font-size: .85rem; }
  .q-list li small { display: block; color: var(--muted); font-size: .74rem; }
  .q-list.ok li { background: var(--soft); }
  .tema-row { display: grid; grid-template-columns: 1fr 30px; gap: 8px; align-items: center; font-size: .82rem; margin-bottom: 6px; }
  .tema-row .track { grid-column: 1 / -1; height: 6px; background: var(--soft); border-radius: 4px; overflow: hidden; margin-top: -4px; }
  .tema-row .fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .tema-row em { font-style: normal; text-align: right; color: var(--muted); }

  section.chat { display: grid; grid-template-rows: 1fr auto; }
  .msgs { overflow: auto; padding: 24px clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 640px; }
  .msg.yo { align-self: flex-end; background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: 16px 16px 4px 16px; }
  .msg.bot { align-self: flex-start; display: grid; grid-template-columns: 32px 1fr; gap: 10px; }
  .msg.bot .av { width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font: 700 .8rem var(--display); color: var(--accent); }
  .burbuja { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; border-radius: 4px 16px 16px 16px; }
  .burbuja p { margin: 0 0 8px; }
  .burbuja p:last-child { margin-bottom: 0; }
  .burbuja.sin { border-color: var(--warn); background: var(--warn-soft); }
  .citas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .cita { border: 1px solid var(--line); background: var(--soft); border-radius: 99px; padding: 3px 10px 3px 6px; font-size: .78rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .cita i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: .7rem; }
  .cita[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .sup { font-size: .7rem; font-weight: 700; color: var(--accent); vertical-align: super; margin-left: 1px; }
  .sugerencias { display: flex; flex-wrap: wrap; gap: 8px; }
  .sug { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 13px; font-size: .88rem; }
  .sug:hover { border-color: var(--accent); }
  .bienvenida h2 { font: 700 1.6rem/1.15 var(--display); margin: 0 0 6px; letter-spacing: -.01em; }
  .bienvenida p { color: var(--muted); margin: 0 0 14px; max-width: 560px; }
  form.enviar { display: flex; gap: 8px; padding: 12px clamp(16px, 4vw, 48px) 16px; border-top: 1px solid var(--line); background: var(--bg); }
  form.enviar input { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; }
  form.enviar button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 0 18px; font-weight: 600; }
  .escribiendo { color: var(--muted); font-size: .85rem; }

  .fuente { background: var(--surface); border-left: 1px solid var(--line); overflow: auto; padding: 18px; }
  .fuente h2 { font: 700 1.05rem var(--display); margin: 0 0 4px; }
  .fuente .meta { color: var(--muted); font-size: .8rem; margin: 0 0 14px; }
  .pasaje { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--soft); }
  .pasaje.top { border-color: var(--accent); }
  .pasaje h3 { font-size: .88rem; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
  .pasaje h3 i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: .72rem; flex: none; }
  .pasaje p { margin: 0; font-size: .86rem; color: var(--ink); }
  .pasaje .doc-name { font-size: .75rem; color: var(--muted); margin: 0 0 6px; }
  .score { margin-left: auto; font-size: .72rem; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .como { font-size: .8rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin-top: 16px; }
  .como b { color: var(--ink); }
  .vacio { color: var(--muted); font-size: .9rem; }
  .cerrar { display: none; }

  @media (max-width: 1100px) { .cols { grid-template-columns: 230px minmax(0, 1fr) 300px; } }
  @media (max-width: 860px) {
    .cols { grid-template-columns: 1fr; }
    .menu-btn { display: inline-block; }
    .pill { display: none; }
    aside.docs, .fuente { position: fixed; z-index: 5; top: 59px; bottom: 0; width: min(88vw, 360px); box-shadow: 0 10px 40px rgba(0,0,0,.25); transition: transform .2s; }
    aside.docs { left: 0; transform: translateX(-105%); }
    .fuente { right: 0; transform: translateX(105%); }
    aside.docs.abierto, .fuente.abierto { transform: none; }
    .cerrar { display: inline-block; float: right; }
  }
  .demo-pie { font-size: .75rem; color: var(--muted); padding: 0 4px; margin-top: 14px; }
  .demo-pie a { color: inherit; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <button class="menu-btn" type="button" data-abrir="docs" aria-label="Ver documentos">☰</button>
    <div class="logo" aria-hidden="true">R</div>
    <div><h1>Distribuidora Ríos</h1><p>Asistente de atención al cliente</p></div>
    <span class="sp"></span>
    <span class="pill" id="pill-docs"></span>
  </header>
  <div class="cols">
    <aside class="docs" aria-label="Documentos y preguntas">
      <div class="tabs" role="group" aria-label="Panel">
        <button type="button" data-panel="docs" aria-pressed="true">Documentos</button>
        <button type="button" data-panel="preguntas" aria-pressed="false">Qué preguntan</button>
      </div>
      <div class="side-body" id="side"></div>
    </aside>
    <section class="chat" aria-label="Chat">
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <form class="enviar" id="enviar">
        <label class="sr" for="pregunta">Tu pregunta</label>
        <input id="pregunta" autocomplete="off" placeholder="Preguntá sobre envíos, pagos, devoluciones…" maxlength="300">
        <button type="submit">Enviar</button>
      </form>
    </section>
    <aside class="fuente" id="fuente" aria-label="Fuentes de la respuesta"></aside>
  </div>
</div>

<script src="docs.js"></script>
<script>
// Asistente sobre documentos (demo). Busca las secciones que mejor responden con BM25,
// arma la respuesta con las oraciones más relevantes y siempre muestra de dónde salió.
// En la versión para un cliente, estos mismos pasajes se le pasan a Claude en el servidor para que redacte.
(function () {
  var CLAVE = 'asistente-rios-v1';
  var VACIAS = ('a al algo algun alguna como con cual cuales cuanto cuanta de del el ella ellos en es esta este esto hay la las le les lo los me mi mis mucho muy no nos o para pero por que quien se si sin sobre su sus te tengo tiene tienen tu un una unos y ya puedo pueden hacer hago hace compre compro puede quiero saber necesito dan ser son estan esta usted ustedes vos hola buenas buen dia tarde gracias').split(' ');
  var vacias = {}; VACIAS.forEach(function (w) { vacias[w] = 1; });
  var $msgs = document.getElementById('msgs'), $side = document.getElementById('side'), $fuente = document.getElementById('fuente');

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function normal(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  // Raíz aproximada para que "envíos", "enviamos" y "envío" coincidan.
  function raiz(w) {
    w = w.replace(/ciones$/, 'cion');
    if (w.length > 4) w = w.replace(/(es|s)$/, '');
    if (w.length > 5) w = w.replace(/(amos|imos|ado|ada|ando|iendo|ar|er|ir|an|en|o|a|e)$/, '');
    return w;
  }
  function tokens(s, conSinonimos) {
    return normal(s).split(/[^a-z0-9ñ]+/).filter(function (w) { return w.length > 1 && !vacias[w]; }).map(function (w) {
      if (conSinonimos && window.SINONIMOS[w]) w = window.SINONIMOS[w];
      return raiz(w);
    });
  }

  // ---------- Índice ----------
  var estado, secciones = [], df = {}, largoMedio = 1;
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch (e) {} }
  function cargar() {
    try { estado = JSON.parse(localStorage.getItem(CLAVE)); } catch (e) { estado = null; }
    if (!estado) estado = { propios: [], registro: [] };
  }
  function todosLosDocs() { return window.DOCUMENTOS.concat(estado.propios); }
  function indexar() {
    secciones = []; df = {};
    todosLosDocs().forEach(function (d) {
      var partes = d.texto.indexOf('## ') >= 0 ? d.texto.split(/^## /m).filter(function (p) { return p.trim(); }) : d.texto.split(/\n\s*\n/).filter(function (p) { return p.trim(); }).map(function (p, i) { return 'Parte ' + (i + 1) + '\n' + p; });
      partes.forEach(function (p) {
        var lineas = p.trim().split('\n'), titulo = lineas.shift().trim(), cuerpo = lineas.join(' ').trim();
        var toks = tokens(titulo + ' ' + titulo + ' ' + d.titulo + ' ' + cuerpo, false);
        var tf = {}; toks.forEach(function (t) { tf[t] = (tf[t] || 0) + 1; });
        Object.keys(tf).forEach(function (t) { df[t] = (df[t] || 0) + 1; });
        secciones.push({ doc: d, titulo: titulo, cuerpo: cuerpo, tf: tf, largo: toks.length });
      });
    });
    largoMedio = secciones.reduce(function (a, s) { return a + s.largo; }, 0) / Math.max(1, secciones.length);
    document.getElementById('pill-docs').textContent = todosLosDocs().length + ' documentos · ' + secciones.length + ' secciones';
  }
  function bm25(q, s) {
    var k1 = 1.4, b = 0.75, N = secciones.length, total = 0, encontrados = 0;
    q.forEach(function (t) {
      var f = s.tf[t]; if (!f) return;
      encontrados++;
      var idf = Math.log(1 + (N - df[t] + 0.5) / (df[t] + 0.5));
      total += idf * (f * (k1 + 1)) / (f + k1 * (1 - b + b * s.largo / largoMedio));
    });
    return { puntaje: total, cobertura: q.length ? encontrados / q.length : 0 };
  }

  // ---------- Respuesta ----------
  // Corta en punto seguido de mayúscula, así "$250.000" o "km 32" no parten la oración.
  function oraciones(texto) { return texto.split(/(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÑ¿¡])/); }
  function responder(pregunta) {
    var nq = normal(pregunta).trim();
    if (/^(hola|buenas|buen dia|buenas tardes|buenas noches)[!. ]*$/.test(nq)) return { tipo: 'saludo' };
    if (/^(gracias|muchas gracias|genial|perfecto)[!. ]*$/.test(nq)) return { tipo: 'gracias' };
    var q = tokens(pregunta, true);
    q = q.filter(function (t, i) { return q.indexOf(t) === i; });
    if (!q.length) return { tipo: 'nada' };
    var ranking = secciones.map(function (s) { var r = bm25(q, s); return { s: s, puntaje: r.puntaje, cobertura: r.cobertura }; })
      .filter(function (r) { return r.puntaje > 0; })
      .sort(function (a, b) { return b.puntaje - a.puntaje; });
    // Si la mejor sección no alcanza, es mejor decir que no está que inventar.
    if (!ranking.length || ranking[0].puntaje < 1.6 || ranking[0].cobertura < 0.34) return { tipo: 'nada', q: q, ranking: ranking.slice(0, 3) };
    var usadas = [ranking[0]];
    if (ranking[1] && ranking[1].puntaje > ranking[0].puntaje * 0.8 && ranking[1].cobertura >= 0.6) usadas.push(ranking[1]);
    var partes = usadas.map(function (r, i) {
      var ors = oraciones(r.s.cuerpo).map(function (o, j) {
        var t = tokens(o, false), hit = 0;
        q.forEach(function (w) { if (t.indexOf(w) >= 0) hit++; });
        return { o: o.trim(), j: j, hit: hit };
      });
      var cuantas = i === 0 ? 2 : 1;
      var mejores = ors.slice().sort(function (a, b) { return b.hit - a.hit || a.j - b.j; }).slice(0, cuantas).filter(function (x, k, arr) { return k === 0 || x.hit * 2 >= arr[0].hit && x.hit > 0; });
      mejores.sort(function (a, b) { return a.j - b.j; });
      var texto = mejores.map(function (m) { return m.o; }).join(' ');
      // Con dos fuentes, cada parte dice de qué sección habla.
      if (usadas.length > 1) texto = r.s.titulo + ': ' + texto.charAt(0).toLowerCase() + texto.slice(1);
      return { texto: texto, n: i + 1 };
    });
    return { tipo: 'ok', q: q, partes: partes, usadas: usadas, ranking: ranking.slice(0, 3) };
  }
  function resaltar(texto, q) {
    return esc(texto).replace(/[A-Za-zÁÉÍÓÚáéíóúÑñÜü0-9$.]+/g, function (w) {
      var limpio = w.replace(/\.$/, '');
      var t = tokens(limpio, false)[0];
      return t && q.indexOf(t) >= 0 ? '<mark>' + limpio + '</mark>' + (w.length > limpio.length ? '.' : '') : w;
    });
  }

  // ---------- Vistas ----------
  var panel = 'docs', ultima = null, citaActiva = null;
  var SUGERENCIAS = ['¿Cuánto cuesta el envío a GBA?', '¿Puedo devolver un producto?', '¿Aceptan Mercado Pago?', '¿Qué horario tiene la sucursal de Moreno?', '¿Cómo abro una cuenta corriente?', '¿Hacen factura A?'];
  var ICONO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>';

  function vistaSide() {
    document.querySelectorAll('[data-panel]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.panel === panel); });
    var html = '';
    if (panel === 'docs') {
      html += '<p class="side-h">Base de conocimiento</p>';
      todosLosDocs().forEach(function (d) {
        var n = secciones.filter(function (s) { return s.doc === d; }).length;
        html += '<button class="doc' + (d.propio ? ' nuevo' : '') + '" type="button" data-doc="' + esc(d.id) + '">' + ICONO + '<span><b>' + esc(d.titulo) + '</b><small>' + n + ' secciones' + (d.propio ? ' · agregado por vos' : '') + '</small></span></button>';
      });
      html += '<div class="add"><p><b>Probá con tus documentos.</b> Pegá un texto o subí un .txt o .md: el asistente lo suma al instante. Queda solo en este navegador.</p>';
      html += '<input type="text" id="nuevo-titulo" placeholder="Título (ej.: Políticas de la empresa)"><textarea id="nuevo-texto" placeholder="Pegá el texto acá. Si usás títulos con ##, cada uno se cita por separado."></textarea>';
      html += '<div class="row"><button class="small-btn primary" type="button" data-agregar>Agregar</button><span class="small-btn file-label">Subir archivo<input type="file" accept=".txt,.md,text/plain,text/markdown" id="archivo"></span></div></div>';
      html += '<p class="demo-pie">Demo de <a href="../../asistente-ia.html">Juan Mattolini</a> con una empresa ficticia.</p>';
    } else {
      var reg = estado.registro, sin = reg.filter(function (r) { return !r.ok; }), con = reg.filter(function (r) { return r.ok; });
      html += '<div class="stat-grid"><div class="stat"><b>' + con.length + '</b><span>respondidas</span></div><div class="stat"><b>' + sin.length + '</b><span>sin respuesta</span></div></div>';
      var temas = {}; con.forEach(function (r) { temas[r.doc] = (temas[r.doc] || 0) + 1; });
      var lista = Object.keys(temas).sort(function (a, b) { return temas[b] - temas[a]; });
      if (lista.length) {
        html += '<p class="side-h">Temas más consultados</p>';
        var max = temas[lista[0]];
        lista.forEach(function (t) { html += '<div class="tema-row"><span>' + esc(t) + '</span><em>' + temas[t] + '</em><div class="track"><div class="fill" style="width:' + Math.round(temas[t] / max * 100) + '%"></div></div></div>'; });
      }
      html += '<p class="side-h">Sin respuesta en los documentos</p>';
      if (sin.length) {
        html += '<ul class="q-list">' + sin.slice(-8).reverse().map(function (r) { return '<li>' + esc(r.texto) + '<small>Conviene sumarlo a los documentos</small></li>'; }).join('') + '</ul>';
      } else html += '<p class="vacio">Todavía ninguna. Las preguntas que el asistente no puede responder aparecen acá para saber qué falta documentar.</p>';
      if (con.length) html += '<p class="side-h">Últimas respondidas</p><ul class="q-list ok">' + con.slice(-5).reverse().map(function (r) { return '<li>' + esc(r.texto) + '<small>' + esc(r.doc) + '</small></li>'; }).join('') + '</ul>';
    }
    $side.innerHTML = html;
  }

  function vistaFuente() {
    var html = '<button class="small-btn cerrar" type="button" data-cerrar>Cerrar</button>';
    if (!ultima || ultima.r.tipo === 'saludo' || ultima.r.tipo === 'gracias') {
      html += '<h2>Fuentes</h2><p class="meta">Acá vas a ver los pasajes de los documentos que usó cada respuesta, con las palabras que coincidieron resaltadas.</p>';
    } else if (ultima.r.tipo === 'nada') {
      html += '<h2>Sin una fuente clara</h2><p class="meta">Ninguna sección alcanzó el mínimo para responder con seguridad.</p>';
      (ultima.r.ranking || []).forEach(function (x) { html += pasaje(x, null, ultima.r.q, false); });
      if (!(ultima.r.ranking || []).length) html += '<p class="vacio">No hubo coincidencias en ningún documento.</p>';
    } else {
      html += '<h2>Fuentes de la respuesta</h2><p class="meta">Pregunta: “' + esc(ultima.pregunta) + '”</p>';
      ultima.r.usadas.forEach(function (x, i) { html += pasaje(x, i + 1, ultima.r.q, citaActiva === null ? i === 0 : citaActiva === i + 1); });
      var otras = ultima.r.ranking.filter(function (x) { return ultima.r.usadas.indexOf(x) < 0; }).slice(0, 2);
      if (otras.length) { html += '<p class="side-h">También se consideró</p>'; otras.forEach(function (x) { html += pasaje(x, null, ultima.r.q, false); }); }
    }
    html += '<div class="como"><b>Cómo responde.</b> Busca en las secciones de los documentos las que mejor coinciden con la pregunta y arma la respuesta solo con esas oraciones. Si nada coincide lo suficiente, lo dice y deja la consulta para una persona. En la versión para un cliente, Claude redacta la respuesta en el servidor a partir de estos mismos pasajes.</div>';
    $fuente.innerHTML = html;
  }
  function pasaje(x, n, q, top) {
    return '<div class="pasaje' + (top ? ' top' : '') + '"><p class="doc-name">' + esc(x.s.doc.titulo) + '</p><h3>' + (n ? '<i>' + n + '</i>' : '') + esc(x.s.titulo) + '<span class="score">' + x.puntaje.toFixed(1) + ' pts · ' + Math.round(x.cobertura * 100) + '%</span></h3><p>' + resaltar(x.s.cuerpo, q || []) + '</p></div>';
  }

  function bienvenida() {
    $msgs.innerHTML = '<div class="bienvenida"><h2>¿En qué te ayudo?</h2><p>Respondo con la información de Distribuidora Ríos: envíos, pagos, devoluciones, sucursales y cuentas para empresas. Cada respuesta dice de qué documento sale.</p><div class="sugerencias">' + SUGERENCIAS.map(function (s) { return '<button class="sug" type="button" data-sug="' + esc(s) + '">' + esc(s) + '</button>'; }).join('') + '</div></div>';
  }
  function agregarMsg(html, clase) { var d = document.createElement('div'); d.className = 'msg ' + clase; d.innerHTML = html; $msgs.appendChild(d); $msgs.scrollTop = $msgs.scrollHeight; return d; }

  function preguntar(texto) {
    texto = texto.trim(); if (!texto) return;
    if ($msgs.querySelector('.bienvenida')) $msgs.innerHTML = '';
    agregarMsg(esc(texto), 'yo');
    var pensando = agregarMsg('<div class="av">R</div><div class="burbuja escribiendo">Buscando en los documentos…</div>', 'bot');
    setTimeout(function () {
      var r = responder(texto), html;
      if (r.tipo === 'saludo') html = '<div class="burbuja"><p>¡Hola! Preguntame lo que necesites sobre envíos, pagos, devoluciones, sucursales o cuentas para empresas.</p></div>';
      else if (r.tipo === 'gracias') html = '<div class="burbuja"><p>¡De nada! Si te queda otra duda, escribime.</p></div>';
      else if (r.tipo === 'nada') html = '<div class="burbuja sin"><p>No encuentro eso en la información de la empresa, y prefiero no adivinar.</p><p>Dejé tu consulta para que la responda una persona del equipo en horario comercial.</p></div>';
      else {
        html = '<div class="burbuja">' + r.partes.map(function (p) { return '<p>' + esc(p.texto) + '<span class="sup">' + p.n + '</span></p>'; }).join('');
        html += '<div class="citas">' + r.usadas.map(function (u, i) { return '<button class="cita" type="button" data-cita="' + (i + 1) + '" aria-pressed="' + (i === 0) + '"><i>' + (i + 1) + '</i>' + esc(u.s.doc.titulo) + ' · ' + esc(u.s.titulo) + '</button>'; }).join('') + '</div></div>';
      }
      pensando.innerHTML = '<div class="av">R</div>' + html;
      $msgs.scrollTop = $msgs.scrollHeight;
      if (r.tipo === 'ok' || r.tipo === 'nada') {
        estado.registro.push({ texto: texto, ok: r.tipo === 'ok', doc: r.tipo === 'ok' ? r.usadas[0].s.doc.titulo : null });
        estado.registro = estado.registro.slice(-200);
        guardar();
        if (panel === 'preguntas') vistaSide();
      }
      ultima = { pregunta: texto, r: r, el: pensando }; citaActiva = null;
      vistaFuente();
    }, 350);
  }

  function agregarDoc(titulo, texto) {
    titulo = (titulo || '').trim() || 'Documento ' + (estado.propios.length + 1);
    texto = (texto || '').trim();
    if (texto.length < 40) { alert('El texto es muy corto: pegá al menos un par de oraciones.'); return; }
    estado.propios.push({ id: 'p' + Date.now(), titulo: titulo.slice(0, 80), texto: texto.slice(0, 60000), propio: true });
    guardar(); indexar(); vistaSide();
    agregarMsg('<div class="av">R</div><div class="burbuja"><p>Sumé “' + esc(titulo) + '” a lo que sé. Ya podés preguntarme sobre eso.</p></div>', 'bot');
  }

  // ---------- Eventos ----------
  document.getElementById('enviar').addEventListener('submit', function (e) { e.preventDefault(); var i = document.getElementById('pregunta'); preguntar(i.value); i.value = ''; i.focus(); });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var d = b.dataset;
    if (d.sug) preguntar(d.sug);
    if (d.panel) { panel = d.panel; vistaSide(); }
    if (d.cita) {
      var msg = b.closest('.msg');
      if (!ultima || msg !== ultima.el) return;
      citaActiva = +d.cita;
      msg.querySelectorAll('.cita').forEach(function (c) { c.setAttribute('aria-pressed', c === b); });
      vistaFuente(); $fuente.classList.add('abierto');
    }
    if (d.doc) {
      var doc = todosLosDocs().find(function (x) { return x.id === d.doc; });
      var secs = secciones.filter(function (s) { return s.doc === doc; });
      $fuente.innerHTML = '<button class="small-btn cerrar" type="button" data-cerrar>Cerrar</button><h2>' + esc(doc.titulo) + '</h2><p class="meta">' + secs.length + ' secciones</p>' + secs.map(function (s) { return '<div class="pasaje"><h3>' + esc(s.titulo) + '</h3><p>' + esc(s.cuerpo) + '</p></div>'; }).join('') + (doc.propio ? '<button class="small-btn" type="button" data-quitar="' + esc(doc.id) + '">Quitar este documento</button>' : '');
      $fuente.classList.add('abierto'); document.querySelector('aside.docs').classList.remove('abierto');
    }
    if (d.quitar) { estado.propios = estado.propios.filter(function (x) { return x.id !== d.quitar; }); guardar(); indexar(); vistaSide(); vistaFuente(); }
    if ('agregar' in d) agregarDoc(document.getElementById('nuevo-titulo').value, document.getElementById('nuevo-texto').value);
    if (d.abrir === 'docs') document.querySelector('aside.docs').classList.toggle('abierto');
    if ('cerrar' in d) $fuente.classList.remove('abierto');
  });
  document.addEventListener('change', function (e) {
    if (e.target.id !== 'archivo' || !e.target.files[0]) return;
    var f = e.target.files[0];
    if (f.size > 500000) { alert('El archivo es muy grande para la demo (máximo 500 KB).'); return; }
    f.text().then(function (t) { agregarDoc(f.name.replace(/\.(txt|md)$/i, ''), t); });
  });

  cargar(); indexar(); vistaSide(); vistaFuente(); bienvenida();
  // Para las capturas: ?p=pregunta abre la demo con esa pregunta ya hecha, y ?panel=preguntas abre el resumen.
  var params = new URLSearchParams(location.search);
  if (params.get('panel') === 'preguntas') { panel = 'preguntas'; vistaSide(); }
  params.getAll('p').forEach(function (p, i) { setTimeout(function () { preguntar(p); }, i * 400); });
})();
</script>
</body>
</html>
