<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turnos, Estudio Ceibo</title>
<meta name="description" content="Demo de turnos online para una peluquería: el cliente elige servicio, profesional, día y hora, y el local ve su agenda del día.">
<meta name="theme-color" content="#F4F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130F" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F1EC;
    --surface: #FFFFFF;
    --ink: #1E1A15;
    --muted: #6B6358;
    --line: #DDD6CB;
    --accent: #1F6F5C;
    --accent-ink: #FFFFFF;
    --accent-soft: #DCEDE7;
    --warn: #A4471C;
    --warn-soft: #F7E3D7;
    --busy: #ECE7DF;
    color-scheme: light;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16130F;
      --surface: #211D18;
      --ink: #F1ECE4;
      --muted: #ABA295;
      --line: #3A342C;
      --accent: #5CC2A6;
      --accent-ink: #0E1A16;
      --accent-soft: #1C342D;
      --warn: #F0A27A;
      --warn-soft: #3A2419;
      --busy: #2A251F;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 400 1rem/1.45 var(--body);
    min-height: 100vh;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header.bar { padding: 18px 18px 8px; display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 800 1.2rem var(--display); flex: none; }
  .bar h1 { font: 700 1.2rem/1.1 var(--display); margin: 0; }
  .bar p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
  main { flex: 1; padding: 6px 18px 96px; }
  h2 { font: 700 1.45rem/1.15 var(--display); margin: 10px 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: .95rem; }
  h3 { font: 600 .8rem var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 8px; }

  .steps { display: flex; gap: 6px; margin: 4px 0 14px; }
  .steps i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
  .steps i.on { background: var(--accent); }

  .list { display: grid; gap: 8px; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 14px;
  }
  .opt:hover { border-color: var(--muted); }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt b { display: block; font-weight: 600; }
  .opt small { color: var(--muted); font-size: .85rem; }
  .opt .right { margin-left: auto; text-align: right; white-space: nowrap; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; flex: none; color: #fff; }

  .days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px; scrollbar-width: none; }
  .days::-webkit-scrollbar { display: none; }
  .day {
    flex: none; width: 58px; padding: 8px 0; border-radius: 14px; border: 1.5px solid var(--line);
    background: var(--surface); text-align: center; line-height: 1.15;
  }
  .day span { display: block; font-size: .75rem; color: var(--muted); text-transform: capitalize; }
  .day b { display: block; font: 700 1.25rem var(--display); margin-top: 2px; }
  .day small { display: block; font-size: .68rem; color: var(--muted); margin-top: 2px; }
  .day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .day[aria-pressed="true"] span, .day[aria-pressed="true"] small { color: inherit; opacity: .85; }
  .day:disabled { opacity: .4; cursor: not-allowed; }

  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .slot { padding: 10px 0; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; }
  .slot[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .empty { background: var(--surface); border: 1.5px dashed var(--line); border-radius: 14px; padding: 18px; color: var(--muted); text-align: center; }

  label.field { display: block; margin-bottom: 12px; }
  label.field span { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 4px; }
  .field input { width: 100%; padding: 12px 13px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
  .field input:focus { border-color: var(--accent); outline: none; }
  .hint { font-size: .8rem; color: var(--muted); margin: -6px 0 12px; }

  .summary { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 4px 14px; margin-bottom: 16px; }
  .summary div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .summary div:last-child { border-bottom: 0; }
  .summary dt { color: var(--muted); }
  .summary dd { margin: 0; font-weight: 600; text-align: right; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn.danger { background: transparent; color: var(--warn); border: 1.5px solid var(--line); }
  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; }
  .actions { display: grid; gap: 8px; margin-top: 16px; }
  .back { background: none; border: 0; padding: 6px 0; color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }

  .ok { text-align: center; padding: 18px 0 6px; }
  .ok .check { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 10px; }
  .ok .check svg { width: 32px; height: 32px; }

  .card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .card .when { font: 700 1.1rem var(--display); }
  .card p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
  .card .row { margin-top: 12px; }
  .card .btn { padding: 10px; font-size: .9rem; }
  .badge { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); vertical-align: middle; }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.gray { background: var(--busy); color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .stat b { display: block; font: 700 1.35rem var(--display); font-variant-numeric: tabular-nums; }
  .stat span { font-size: .75rem; color: var(--muted); }

  .agenda { display: grid; gap: 8px; }
  .appt { display: grid; grid-template-columns: 54px 1fr; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; border-left: 5px solid var(--c, var(--accent)); }
  .appt time { font-weight: 700; font-variant-numeric: tabular-nums; }
  .appt time small { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; }
  .appt b { font-weight: 600; }
  .appt p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
  .appt .mini { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .appt .mini button, .appt .mini a { font-size: .78rem; padding: 4px 9px; border-radius: 99px; border: 1.5px solid var(--line); background: transparent; text-decoration: none; font-weight: 600; color: inherit; }
  .appt .mini a { color: var(--accent); border-color: var(--accent); }
  .appt.done { opacity: .6; }
  .gap-row { font-size: .8rem; color: var(--muted); padding: 2px 4px 2px 66px; }

  .chips { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .chip { border: 1.5px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 99px; font-size: .85rem; font-weight: 600; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .bars { display: grid; gap: 6px; margin-bottom: 14px; }
  .barline { display: grid; grid-template-columns: 70px 1fr 40px; gap: 8px; align-items: center; font-size: .85rem; }
  .barline .track { height: 10px; border-radius: 6px; background: var(--busy); overflow: hidden; }
  .barline .fill { height: 100%; border-radius: 6px; background: var(--c, var(--accent)); }
  .barline em { font-style: normal; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs div { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
  nav.tabs button { background: none; border: 0; padding: 6px 0; display: grid; justify-items: center; gap: 2px; font-size: .75rem; font-weight: 600; color: var(--muted); }
  nav.tabs svg { width: 24px; height: 24px; }
  nav.tabs button[aria-current="page"] { color: var(--accent); }
  .demo-note { font-size: .78rem; color: var(--muted); text-align: center; margin: 22px 0 0; }
  .demo-note a { color: inherit; }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  .toast.on { opacity: 1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="logo" aria-hidden="true">C</div>
    <div>
      <h1>Estudio Ceibo</h1>
      <p>Peluquería · Av. Siempreviva 742</p>
    </div>
  </header>
  <main id="vista" tabindex="-1"></main>
  <nav class="tabs" aria-label="Secciones">
    <div>
      <button type="button" data-tab="reservar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M12 14v4M10 16h4"/></svg>Reservar</button>
      <button type="button" data-tab="mios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Mis turnos</button>
      <button type="button" data-tab="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Agenda del local</button>
    </div>
  </nav>
</div>
<div class="toast" role="status" aria-live="polite"></div>

<script>
// Demo de turnos online. Todo corre en el navegador y se guarda en localStorage;
// en la versión para un cliente los turnos viven en Supabase y los avisos salen por WhatsApp desde el servidor.
(function () {
  var LOCAL_WA = '5491100000000';
  var SERVICIOS = [
    { id: 'corte', nombre: 'Corte', min: 30, precio: 12000 },
    { id: 'corte-barba', nombre: 'Corte y barba', min: 45, precio: 16000 },
    { id: 'color', nombre: 'Color', min: 90, precio: 38000 },
    { id: 'brushing', nombre: 'Lavado y brushing', min: 30, precio: 9000 },
    { id: 'tratamiento', nombre: 'Tratamiento de nutrición', min: 60, precio: 22000 }
  ];
  var PROS = [
    { id: 'lu', nombre: 'Lucía', hace: ['corte', 'color', 'brushing', 'tratamiento'], color: '#B4572E' },
    { id: 'ma', nombre: 'Martín', hace: ['corte', 'corte-barba', 'brushing'], color: '#2D6A8E' },
    { id: 'so', nombre: 'Sofía', hace: ['corte', 'color', 'tratamiento', 'brushing'], color: '#7A4E9B' }
  ];
  // Horario por día de la semana (0 = domingo): [apertura, cierre] en minutos.
  var HORARIO = { 2: [9 * 60, 19 * 60], 3: [9 * 60, 19 * 60], 4: [9 * 60, 19 * 60], 5: [9 * 60, 20 * 60], 6: [9 * 60, 14 * 60] };
  var PASO = 15, DIAS_A_LA_VISTA = 14, ANTICIPACION_MIN = 60;
  var CLAVE = 'turnos-ceibo-v1';

  var $vista = document.getElementById('vista');
  var $toast = document.querySelector('.toast');
  var fmtDia = new Intl.DateTimeFormat('es-AR', { weekday: 'short' });
  var fmtLargo = new Intl.DateTimeFormat('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
  var fmtPeso = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 });

  function hoy0() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function sumarDias(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function clave(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function deClave(s) { var p = s.split('-'); return new Date(+p[0], p[1] - 1, +p[2]); }
  function hhmm(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
  function servicio(id) { return SERVICIOS.find(function (s) { return s.id === id; }); }
  function pro(id) { return PROS.find(function (p) { return p.id === id; }); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function avisar(t) { $toast.textContent = t; $toast.classList.add('on'); clearTimeout(avisar.t); avisar.t = setTimeout(function () { $toast.classList.remove('on'); }, 2600); }

  // ---------- Datos ----------
  var estado;
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch (e) {} }
  function cargar() {
    try { estado = JSON.parse(localStorage.getItem(CLAVE)); } catch (e) { estado = null; }
    if (!estado || !estado.turnos) estado = { turnos: ejemplo(), mios: [], cliente: { nombre: '', tel: '' } };
    // Los turnos de ejemplo se regeneran si quedaron viejos.
    if (estado.creado !== clave(hoy0())) {
      estado.turnos = estado.turnos.filter(function (t) { return t.mio; }).concat(ejemplo());
      estado.creado = clave(hoy0());
      guardar();
    }
  }
  // Turnos de otros clientes para que la agenda no arranque vacía. Siempre los mismos para un mismo día.
  function ejemplo() {
    var nombres = ['Carla P.', 'Diego R.', 'Valentina G.', 'Nicolás F.', 'Julieta M.', 'Tomás A.', 'Paula S.', 'Federico L.', 'Ana B.', 'Mateo C.', 'Camila V.', 'Joaquín D.'];
    var lista = [], semilla = 7;
    function azar() { semilla = (semilla * 9301 + 49297) % 233280; return semilla / 233280; }
    for (var i = 0; i < DIAS_A_LA_VISTA; i++) {
      var d = sumarDias(hoy0(), i), h = HORARIO[d.getDay()];
      if (!h) continue;
      PROS.forEach(function (p) {
        var m = h[0] + Math.floor(azar() * 4) * PASO;
        while (m < h[1] - 30) {
          if (azar() < 0.55) {
            var s = servicio(p.hace[Math.floor(azar() * p.hace.length)]);
            if (m + s.min <= h[1]) lista.push({ id: 'e' + lista.length, dia: clave(d), ini: m, servicio: s.id, pro: p.id, nombre: nombres[Math.floor(azar() * nombres.length)], tel: '11' + Math.floor(40000000 + azar() * 9999999), estado: 'reservado' });
            m += s.min + (azar() < 0.4 ? PASO * 2 : 0);
          } else {
            m += PASO * 2;
          }
        }
      });
    }
    return lista;
  }

  // ---------- Disponibilidad ----------
  // Un horario está libre si el servicio entra completo antes del cierre y no se pisa con otro turno de esa persona.
  function libre(dia, ini, min, proId) {
    var h = HORARIO[deClave(dia).getDay()];
    if (!h || ini < h[0] || ini + min > h[1]) return false;
    if (dia === clave(hoy0())) { var ahora = new Date(); if (ini < ahora.getHours() * 60 + ahora.getMinutes() + ANTICIPACION_MIN) return false; }
    return !estado.turnos.some(function (t) {
      if (t.dia !== dia || t.pro !== proId || t.estado === 'cancelado') return false;
      var fin = t.ini + servicio(t.servicio).min;
      return ini < fin && t.ini < ini + min;
    });
  }
  // Horarios del día; con "Cualquiera" alcanza con que alguien que hace el servicio esté libre.
  function horarios(dia, servId, proId) {
    var h = HORARIO[deClave(dia).getDay()], s = servicio(servId), out = [];
    if (!h) return out;
    var candidatos = proId === 'cualquiera' ? PROS.filter(function (p) { return p.hace.indexOf(servId) >= 0; }) : [pro(proId)];
    for (var m = h[0]; m + s.min <= h[1]; m += PASO) {
      var quien = candidatos.find(function (p) { return libre(dia, m, s.min, p.id); });
      if (quien) out.push({ ini: m, pro: quien.id });
    }
    return out;
  }

  // ---------- Vistas ----------
  var tab = 'reservar';
  var paso = { n: 1, servicio: null, pro: null, dia: null, ini: null, proAsignado: null };
  var agendaDia = clave(hoy0()), agendaPro = 'todos';

  function render() {
    document.querySelectorAll('nav.tabs button').forEach(function (b) { b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'); });
    if (tab === 'reservar') vistaReservar();
    if (tab === 'mios') vistaMios();
    if (tab === 'agenda') vistaAgenda();
  }
  function pasos(n) { var s = '<div class="steps" aria-hidden="true">'; for (var i = 1; i <= 4; i++) s += '<i class="' + (i <= n ? 'on' : '') + '"></i>'; return s + '</div>'; }
  function volver() { return '<button class="back" type="button" data-volver>‹ Volver</button>'; }

  function vistaReservar() {
    var html = '';
    if (paso.n === 1) {
      html += pasos(1) + '<h2>¿Qué te hacés?</h2><p class="sub">Elegí el servicio. La duración ya incluye el tiempo de preparación.</p><div class="list">';
      SERVICIOS.forEach(function (s) {
        html += '<button class="opt" type="button" data-servicio="' + s.id + '" aria-pressed="' + (paso.servicio === s.id) + '"><div><b>' + s.nombre + '</b><small>' + s.min + ' min</small></div><div class="right"><b>' + fmtPeso.format(s.precio) + '</b></div></button>';
      });
      html += '</div>';
    }
    if (paso.n === 2) {
      var s = servicio(paso.servicio);
      html += volver() + pasos(2) + '<h2>¿Con quién?</h2><p class="sub">' + s.nombre + ' · ' + s.min + ' min</p><div class="list">';
      html += '<button class="opt" type="button" data-pro="cualquiera"><div class="avatar" style="background:var(--muted)">★</div><div><b>Cualquiera</b><small>El primer horario libre</small></div></button>';
      PROS.filter(function (p) { return p.hace.indexOf(s.id) >= 0; }).forEach(function (p) {
        var prox = proximo(s.id, p.id);
        html += '<button class="opt" type="button" data-pro="' + p.id + '"><div class="avatar" style="background:' + p.color + '">' + p.nombre[0] + '</div><div><b>' + p.nombre + '</b><small>' + (prox ? 'Próximo: ' + prox : 'Sin horarios esta semana') + '</small></div></button>';
      });
      html += '</div>';
    }
    if (paso.n === 3) {
      var s3 = servicio(paso.servicio);
      if (!paso.dia) paso.dia = primerDiaConLugar();
      html += volver() + pasos(3) + '<h2>Día y hora</h2><p class="sub">' + s3.nombre + ' · ' + (paso.pro === 'cualquiera' ? 'cualquier profesional' : 'con ' + pro(paso.pro).nombre) + '</p>';
      html += '<div class="days" role="group" aria-label="Día">';
      for (var i = 0; i < DIAS_A_LA_VISTA; i++) {
        var d = sumarDias(hoy0(), i), k = clave(d), n = horarios(k, paso.servicio, paso.pro).length;
        html += '<button class="day" type="button" data-dia="' + k + '" aria-pressed="' + (paso.dia === k) + '"' + (n ? '' : ' disabled') + ' aria-label="' + fmtLargo.format(d) + (n ? ', ' + n + ' horarios' : ', cerrado o completo') + '"><span>' + (i === 0 ? 'hoy' : fmtDia.format(d).replace('.', '')) + '</span><b>' + d.getDate() + '</b><small>' + (HORARIO[d.getDay()] ? (n ? n + ' lib.' : 'lleno') : 'cerrado') + '</small></button>';
      }
      html += '</div>';
      var hs = paso.dia ? horarios(paso.dia, paso.servicio, paso.pro) : [];
      html += '<h3>' + (paso.dia ? cap(fmtLargo.format(deClave(paso.dia))) : 'Elegí un día') + '</h3>';
      if (hs.length) {
        html += '<div class="slots">';
        hs.forEach(function (h) { html += '<button class="slot" type="button" data-ini="' + h.ini + '" data-asignado="' + h.pro + '" aria-pressed="' + (paso.ini === h.ini) + '">' + hhmm(h.ini) + '</button>'; });
        html += '</div>';
      } else {
        html += '<p class="empty">No quedan horarios este día. Probá con otro.</p>';
      }
    }
    if (paso.n === 4) {
      var s4 = servicio(paso.servicio), p4 = pro(paso.proAsignado);
      html += volver() + pasos(4) + '<h2>Tus datos</h2><p class="sub">Te mandamos la confirmación y un recordatorio el día anterior.</p>';
      html += '<dl class="summary"><div><dt>Servicio</dt><dd>' + s4.nombre + '</dd></div><div><dt>Con</dt><dd>' + p4.nombre + '</dd></div><div><dt>Cuándo</dt><dd>' + cap(fmtLargo.format(deClave(paso.dia))) + ', ' + hhmm(paso.ini) + '</dd></div><div><dt>Precio</dt><dd>' + fmtPeso.format(s4.precio) + '</dd></div></dl>';
      html += '<form id="datos" novalidate><label class="field"><span>Nombre y apellido</span><input name="nombre" autocomplete="name" required value="' + esc(estado.cliente.nombre) + '"></label>';
      html += '<label class="field"><span>Celular con WhatsApp</span><input name="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="11 2345 6789" required value="' + esc(estado.cliente.tel) + '"></label>';
      html += '<p class="hint">Solo lo usamos para avisarte de este turno.</p><button class="btn" type="submit">Confirmar turno</button></form>';
    }
    if (paso.n === 5) {
      var t = estado.turnos.find(function (x) { return x.id === paso.confirmado; });
      html += '<div class="ok"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2>¡Listo, ' + esc(t.nombre.split(' ')[0]) + '!</h2><p class="sub">Tu turno quedó reservado.</p></div>';
      html += resumenTurno(t) + accionesTurno(t, true);
      html += '<div class="actions"><button class="btn ghost" type="button" data-otro>Reservar otro turno</button></div>';
    }
    html += '<p class="demo-note">Demo de <a href="../../turnos.html">Juan Mattolini</a>. Los turnos se guardan solo en este navegador.</p>';
    $vista.innerHTML = html;
  }
  function proximo(servId, proId) {
    for (var i = 0; i < DIAS_A_LA_VISTA; i++) {
      var d = sumarDias(hoy0(), i), hs = horarios(clave(d), servId, proId);
      if (hs.length) return (i === 0 ? 'hoy' : i === 1 ? 'mañana' : fmtDia.format(d).replace('.', '') + ' ' + d.getDate()) + ' ' + hhmm(hs[0].ini);
    }
    return null;
  }
  function primerDiaConLugar() {
    for (var i = 0; i < DIAS_A_LA_VISTA; i++) { var k = clave(sumarDias(hoy0(), i)); if (horarios(k, paso.servicio, paso.pro).length) return k; }
    return null;
  }
  function resumenTurno(t) {
    var s = servicio(t.servicio);
    return '<dl class="summary"><div><dt>Servicio</dt><dd>' + s.nombre + '</dd></div><div><dt>Con</dt><dd>' + pro(t.pro).nombre + '</dd></div><div><dt>Cuándo</dt><dd>' + cap(fmtLargo.format(deClave(t.dia))) + ', ' + hhmm(t.ini) + ' a ' + hhmm(t.ini + s.min) + '</dd></div><div><dt>Dónde</dt><dd>Av. Siempreviva 742</dd></div></dl>';
  }
  function textoTurno(t) { return servicio(t.servicio).nombre + ' con ' + pro(t.pro).nombre + ', ' + fmtLargo.format(deClave(t.dia)) + ' a las ' + hhmm(t.ini); }
  function waLocal(t) { return 'https://wa.me/' + LOCAL_WA + '?text=' + encodeURIComponent('Hola, soy ' + t.nombre + '. Reservé ' + textoTurno(t) + '.'); }
  function fechaICS(dia, m) { return dia.replace(/-/g, '') + 'T' + hhmm(m).replace(':', '') + '00'; }
  function googleCal(t) {
    var s = servicio(t.servicio);
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(s.nombre + ' en Estudio Ceibo') + '&dates=' + fechaICS(t.dia, t.ini) + '/' + fechaICS(t.dia, t.ini + s.min) + '&location=' + encodeURIComponent('Av. Siempreviva 742') + '&details=' + encodeURIComponent('Con ' + pro(t.pro).nombre + '. Para cambiarlo, escribinos por WhatsApp.');
  }
  function accionesTurno(t, grande) {
    return '<div class="actions"><a class="btn" href="' + googleCal(t) + '" target="_blank" rel="noopener">Agregar al calendario</a><div class="row"><button class="btn ghost" type="button" data-ics="' + t.id + '">Descargar .ics</button><a class="btn ghost" href="' + waLocal(t) + '" target="_blank" rel="noopener">Escribir al local</a></div>' + (grande ? '' : '') + '</div>';
  }
  function descargarICS(t) {
    var s = servicio(t.servicio);
    var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Estudio Ceibo//Turnos//ES', 'BEGIN:VEVENT', 'UID:' + t.id + '@estudio-ceibo', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z',
      'DTSTART:' + fechaICS(t.dia, t.ini), 'DTEND:' + fechaICS(t.dia, t.ini + s.min), 'SUMMARY:' + s.nombre + ' en Estudio Ceibo', 'LOCATION:Av. Siempreviva 742',
      'BEGIN:VALARM', 'TRIGGER:-PT2H', 'ACTION:DISPLAY', 'DESCRIPTION:Turno en Estudio Ceibo', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    a.download = 'turno-estudio-ceibo.ics';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function vistaMios() {
    var ahora = clave(hoy0());
    var mios = estado.turnos.filter(function (t) { return t.mio && t.estado !== 'cancelado' && t.dia >= ahora; }).sort(orden);
    var html = '<h2>Mis turnos</h2><p class="sub">Podés cancelar hasta 2 horas antes. Si cancelás, el horario se libera para otra persona.</p>';
    if (!mios.length) html += '<p class="empty">Todavía no tenés turnos. <br><button class="back" type="button" data-ir="reservar">Reservar uno ›</button></p>';
    mios.forEach(function (t) {
      var s = servicio(t.servicio), cancelable = puedeCancelar(t);
      html += '<article class="card"><div class="when">' + cap(fmtLargo.format(deClave(t.dia))) + ', ' + hhmm(t.ini) + '</div><p>' + s.nombre + ' con ' + pro(t.pro).nombre + ' · ' + s.min + ' min · ' + fmtPeso.format(s.precio) + '</p>';
      html += '<div class="row"><a class="btn ghost" href="' + googleCal(t) + '" target="_blank" rel="noopener">Calendario</a>' + (cancelable ? '<button class="btn danger" type="button" data-cancelar="' + t.id + '">Cancelar</button>' : '<button class="btn danger" type="button" disabled>Ya no se puede cancelar</button>') + '</div></article>';
    });
    html += '<p class="demo-note">En la versión real el recordatorio sale solo por WhatsApp 24 horas antes.</p>';
    $vista.innerHTML = html;
  }
  function puedeCancelar(t) { var d = deClave(t.dia); d.setMinutes(t.ini); return d - new Date() > 2 * 3600 * 1000; }
  function orden(a, b) { return a.dia === b.dia ? a.ini - b.ini : a.dia < b.dia ? -1 : 1; }

  function vistaAgenda() {
    var d = deClave(agendaDia), h = HORARIO[d.getDay()];
    var delDia = estado.turnos.filter(function (t) { return t.dia === agendaDia && t.estado !== 'cancelado' && (agendaPro === 'todos' || t.pro === agendaPro); }).sort(orden);
    var html = '<h2>Agenda del día</h2><p class="sub">Lo que ve el local. Los turnos nuevos aparecen acá apenas alguien reserva.</p>';
    html += '<div class="days" role="group" aria-label="Día">';
    for (var i = 0; i < 7; i++) {
      var di = sumarDias(hoy0(), i), k = clave(di);
      var n = estado.turnos.filter(function (t) { return t.dia === k && t.estado !== 'cancelado'; }).length;
      html += '<button class="day" type="button" data-agenda-dia="' + k + '" aria-pressed="' + (agendaDia === k) + '"><span>' + (i === 0 ? 'hoy' : fmtDia.format(di).replace('.', '')) + '</span><b>' + di.getDate() + '</b><small>' + (HORARIO[di.getDay()] ? n + ' turnos' : 'cerrado') + '</small></button>';
    }
    html += '</div>';
    if (!h) { $vista.innerHTML = html + '<p class="empty">El local está cerrado este día.</p>'; return; }

    var abierto = h[1] - h[0];
    var ocupado = 0, plata = 0;
    delDia.forEach(function (t) { var s = servicio(t.servicio); ocupado += s.min; plata += s.precio; });
    var capacidad = abierto * (agendaPro === 'todos' ? PROS.length : 1);
    html += '<div class="stats"><div class="stat"><b>' + delDia.length + '</b><span>turnos</span></div><div class="stat"><b>' + Math.round(ocupado / capacidad * 100) + '%</b><span>ocupación</span></div><div class="stat"><b>' + fmtPeso.format(plata).replace(/\s/g, '') + '</b><span>estimado</span></div></div>';
    html += '<div class="bars">';
    PROS.forEach(function (p) {
      var m = 0; estado.turnos.forEach(function (t) { if (t.dia === agendaDia && t.pro === p.id && t.estado !== 'cancelado') m += servicio(t.servicio).min; });
      var pct = Math.round(m / abierto * 100);
      html += '<div class="barline" style="--c:' + p.color + '"><span>' + p.nombre + '</span><div class="track"><div class="fill" style="width:' + pct + '%"></div></div><em>' + pct + '%</em></div>';
    });
    html += '</div><div class="chips" role="group" aria-label="Profesional"><button class="chip" type="button" data-agenda-pro="todos" aria-pressed="' + (agendaPro === 'todos') + '">Todos</button>';
    PROS.forEach(function (p) { html += '<button class="chip" type="button" data-agenda-pro="' + p.id + '" aria-pressed="' + (agendaPro === p.id) + '">' + p.nombre + '</button>'; });
    html += '</div><div class="agenda">';
    if (!delDia.length) html += '<p class="empty">No hay turnos para este día.</p>';
    delDia.forEach(function (t) {
      var s = servicio(t.servicio), p = pro(t.pro);
      var estadoTxt = t.estado === 'atendido' ? '<span class="badge gray">Atendido</span>' : t.estado === 'ausente' ? '<span class="badge warn">No vino</span>' : t.mio ? '<span class="badge">Nuevo</span>' : '';
      var wa = 'https://wa.me/549' + t.tel.replace(/\D/g, '') + '?text=' + encodeURIComponent('Hola ' + t.nombre.split(' ')[0] + ', te recordamos tu turno: ' + textoTurno(t) + '. ¡Te esperamos!');
      html += '<div class="appt' + (t.estado === 'atendido' || t.estado === 'ausente' ? ' done' : '') + '" style="--c:' + p.color + '"><time>' + hhmm(t.ini) + '<small>' + hhmm(t.ini + s.min) + '</small></time><div><b>' + esc(t.nombre) + '</b> ' + estadoTxt + '<p>' + s.nombre + ' · ' + p.nombre + '</p>';
      if (t.estado === 'reservado') html += '<div class="mini"><a href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a><button type="button" data-marcar="atendido" data-id="' + t.id + '">Vino</button><button type="button" data-marcar="ausente" data-id="' + t.id + '">No vino</button></div>';
      html += '</div></div>';
    });
    html += '</div>';
    $vista.innerHTML = html;
  }

  // ---------- Eventos ----------
  document.querySelector('nav.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]'); if (!b) return;
    tab = b.dataset.tab; if (tab === 'reservar' && paso.n === 5) paso = { n: 1 };
    render(); window.scrollTo(0, 0);
  });
  $vista.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    var ds = b.dataset;
    if ('volver' in ds) { paso.n--; if (paso.n === 3) paso.ini = null; if (paso.n === 2) { paso.dia = null; paso.ini = null; } render(); return; }
    if (ds.servicio) { paso = { n: 2, servicio: ds.servicio }; render(); return; }
    if (ds.pro) { paso.pro = ds.pro; paso.n = 3; paso.dia = null; paso.ini = null; render(); return; }
    if (ds.dia) { paso.dia = ds.dia; paso.ini = null; render(); return; }
    if (ds.ini) { paso.ini = +ds.ini; paso.proAsignado = ds.asignado; paso.n = 4; render(); window.scrollTo(0, 0); return; }
    if ('otro' in ds) { paso = { n: 1 }; render(); return; }
    if (ds.ir) { tab = ds.ir; paso = { n: 1 }; render(); return; }
    if (ds.ics) { descargarICS(estado.turnos.find(function (t) { return t.id === ds.ics; })); return; }
    if (ds.cancelar) {
      if (!confirm('¿Cancelar este turno? El horario queda libre para otra persona.')) return;
      estado.turnos.find(function (t) { return t.id === ds.cancelar; }).estado = 'cancelado';
      guardar(); render(); avisar('Turno cancelado. Te avisamos al local.'); return;
    }
    if (ds.agendaDia) { agendaDia = ds.agendaDia; render(); return; }
    if (ds.agendaPro) { agendaPro = ds.agendaPro; render(); return; }
    if (ds.marcar) { estado.turnos.find(function (t) { return t.id === ds.id; }).estado = ds.marcar; guardar(); render(); return; }
  });
  $vista.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, nombre = f.nombre.value.trim(), tel = f.tel.value.replace(/[^\d]/g, '');
    if (nombre.length < 2) { f.nombre.focus(); avisar('Escribí tu nombre.'); return; }
    if (tel.length < 8) { f.tel.focus(); avisar('Revisá el celular: faltan números.'); return; }
    // Se vuelve a comprobar por si el horario se ocupó mientras completabas los datos.
    if (!libre(paso.dia, paso.ini, servicio(paso.servicio).min, paso.proAsignado)) { avisar('Ese horario se acaba de ocupar. Elegí otro.'); paso.n = 3; paso.ini = null; render(); return; }
    var t = { id: 't' + Date.now(), dia: paso.dia, ini: paso.ini, servicio: paso.servicio, pro: paso.proAsignado, nombre: nombre, tel: tel, estado: 'reservado', mio: true };
    estado.turnos.push(t);
    estado.cliente = { nombre: nombre, tel: f.tel.value.trim() };
    guardar();
    paso = { n: 5, confirmado: t.id };
    render(); window.scrollTo(0, 0); $vista.focus({ preventScroll: true });
  });

  cargar();
  var inicio = new URLSearchParams(location.search).get('vista');
  if (inicio === 'agenda' || inicio === 'mios') tab = inicio;
  render();
})();
</script>
</body>
</html>
